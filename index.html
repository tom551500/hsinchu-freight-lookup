const records=data.tariffs,sections=data.sections,q=document.querySelector('#q'),out=document.querySelector('#results'),count=document.querySelector('#count'),browse=document.querySelector('#browse');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hi(s,term){if(!term)return esc(s);let low=s.toLocaleLowerCase(),needle=term.toLocaleLowerCase(),i=0,j,out='';while((j=low.indexOf(needle,i))!==-1){out+=esc(s.slice(i,j))+'<span class="mark">'+esc(s.slice(j,j+needle.length))+'</span>';i=j+needle.length}return out+esc(s.slice(i))}
function card(r,term=''){let searchText=[r.branch,r.code,r.county,r.column,r.destination,r.minimum,r.per100,r.special,...(r.detail||[])].join(' ');let branch=term?hi(r.branch,term):esc(r.branch);let dest=term?hi(r.destination,term):esc(r.destination);let extra=r.page===2?`<span class="tag gray">${esc(r.county||'')} ${r.code?`· 代碼 ${esc(r.code)}`:''}</span>`:`<span class="tag gray">聯運轉運</span>`;let fees=r.kind==='special'?`<div class="special">${term?hi(r.special,term):esc(r.special)}</div>`:(r.minimum||r.per100?`<div class="fees"><div class="fee"><small>起碼運費</small><strong>NT$ ${esc(r.minimum||'原表未列')}</strong></div><div class="fee"><small>每百公斤運費</small><strong>NT$ ${esc(r.per100||'原表未列')}</strong></div></div>`:`<div class="no-fee">原表此項未列費率</div>`);let details=r.detail?.length?`<details class="more"><summary>查看原單補充文字／配送聯絡資料</summary><div class="original">${esc(r.detail.join('\n'))}</div></details>`:'';return `<article class="tariff" data-search="${esc(searchText)}"><div class="head"><span class="branch">${branch}</span>${extra}<span class="tag gray">單據第 ${r.page} 頁</span></div><div class="dest-label">${r.page===2?'配送地區／時效':'原單配送範圍'}</div><div class="destination">${dest||'原表未標示到達地'}</div>${fees}${details}</article>`}
function rawMatches(term){let all=[];for(const s of sections){let indices=[];s.lines.forEach((line,i)=>{if(line.toLocaleLowerCase().includes(term.toLocaleLowerCase()))indices.push(i)});if(!indices.length)continue;let ranges=[];for(const i of indices){let a=Math.max(0,i-1),b=Math.min(s.lines.length-1,i+1),last=ranges[ranges.length-1];if(last&&a<=last[1]+1)last[1]=Math.max(last[1],b);else ranges.push([a,b])}let rows=ranges.flatMap(([a,b])=>s.lines.slice(a,b+1).map((line,j)=>({line,index:a+j,match:indices.includes(a+j)})));all.push({section:s,rows,matched:indices.length})}return all}
function showBrowse(){let pages=sections.map(s=>`<details class="source"><summary>${esc(s.title)} · ${s.lines.length} 行原文</summary><div class="source-lines">${s.lines.map((line,i)=>`<div class="src"><span class="ln">${String(i+1).padStart(2,'0')}</span>${esc(line)||'　'}</div>`).join('')}</div></details>`).join('');browse.innerHTML=`<details class="browse"><summary>瀏覽全部 ${records.length} 筆配送費率資料</summary><div class="cards" style="margin-top:13px">${records.map(r=>card(r)).join('')}</div></details><details class="browse"><summary>查看三頁附件完整文字（${data.counts.sourceLines} 行）</summary><div class="source-grid">${pages}</div></details>`}
function render(){let term=q.value.trim();if(!term){count.textContent=`已整理 ${records.length} 筆配送／費率資料，涵蓋起碼運費、每百公斤、配送時效與原單補充；空白可展開完整資料。`;out.innerHTML='<div class="intro">輸入地名或關鍵字後，符合的配送資料會各自成卡，運費欄位會清楚分列。結果依附件頁面順序排列。</div>';showBrowse();return}browse.innerHTML='';let hits=records.filter(r=>[r.branch,r.code,r.county,r.column,r.destination,r.minimum,r.per100,r.special,...(r.detail||[])].join(' ').toLocaleLowerCase().includes(term.toLocaleLowerCase()));let raw=rawMatches(term);count.textContent=`找到 ${hits.length} 筆配送／費率資料；原單文字另有 ${raw.reduce((n,x)=>n+x.matched,0)} 行命中。`;out.innerHTML=hits.map(r=>card(r,term)).join('');if(raw.length){out.innerHTML+=`<details class="browse"><summary>查看符合關鍵字的原單文字與相鄰內容</summary><div class="source-grid">${raw.map(group=>`<section class="source"><strong>${esc(group.section.title)}</strong>${group.rows.map(x=>`<div class="hit ${x.match?'':'context'}">${x.match?hi(x.line,term):esc(x.line)||'　'}</div>`).join('')}</section>`).join('')}</div></details>`}if(!hits.length&&!raw.length)out.innerHTML='<div class="empty">找不到符合項目，試著輸入較短地名、村里、電話片段或費率。</div>'}
q.addEventListener('input',render);document.querySelector('#clear').onclick=()=>{q.value='';render();q.focus()};render();
