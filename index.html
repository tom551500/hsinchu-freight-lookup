function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hi(s,term){if(!term)return esc(s);let low=s.toLocaleLowerCase(),needle=term.toLocaleLowerCase(),i=0,j,out='';while((j=low.indexOf(needle,i))!==-1){out+=esc(s.slice(i,j))+'<span class="match">'+esc(s.slice(j,j+needle.length))+'</span>';i=j+needle.length}return out+esc(s.slice(i))}
function render(){let term=q.value.trim(),norm=term.toLocaleLowerCase(),hits=0,html='';for(const sec of sections){let ids=[];if(norm)sec.lines.forEach((s,i)=>{if(s.toLocaleLowerCase().includes(norm))ids.push(i)});if(norm&&!ids.length)continue;hits+=ids.length;let head=`<div class="head"><h2>${esc(sec.title)}</h2><span class="tag">單據第 ${sec.page} 頁</span><span class="tag">${sec.lines.length} 行</span></div>`;if(norm){let ranges=[];for(const i of ids){let a=Math.max(0,i-1),b=Math.min(sec.lines.length-1,i+1),last=ranges[ranges.length-1];if(last&&a<=last[1]+1)last[1]=Math.max(last[1],b);else ranges.push([a,b])}let cards=ranges.map(([a,b])=>`<div class="hit">${sec.lines.slice(a,b+1).map((s,j)=>`<p class="${ids.includes(a+j)?'':'ctx'}">${hi(s,term)||'　'}</p>`).join('')}</div>`).join('');html+=`<section class="section">${head}${cards}</section>`}else{html+=`<section class="section">${head}<details class="full"><summary>展開本區全部原文</summary><div class="transcript">${sec.lines.map((s,i)=>`<div class="srcLine"><span class="no">${String(i+1).padStart(2,'0')}</span>${esc(s)||'　'}</div>`).join('')}</div></details></section>`}}if(norm){count.textContent=`找到 ${hits} 行符合「${term}」；每個結果附上前後原文，方便對照。`;out.innerHTML=html||'<div class="empty">沒有找到符合的內容。試試較短的地名、村里名或部分電話。</div>'}else{count.textContent=`完整收錄 ${sections.length} 個單據區塊、${sections.reduce((n,s)=>n+s.lines.length,0)} 行原文。展開各區可瀏覽全文，或直接搜尋。`;out.innerHTML=`<div class="intro">三頁單據的內容都已納入，包括偏遠地區配送安排、每百公斤費率、聯絡人、外車轉運里別、村里與街路名稱。輸入關鍵字即可即時篩選。</div>${html}`}}
q.addEventListener('input',render);document.querySelector('#clear').onclick=()=>{q.value='';render();q.focus()};render();
</script></body></html>
